<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempMail - Free Disposable Email</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                </svg>
                <h1>TempMail</h1>
                <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
            </div>
            <p class="tagline">The world's most relaxing temp mail</p>
        </header>

        <section class="email-section">
            <div class="email-box">
                <div class="email-display" id="emailDisplay">
                    <span class="placeholder">Click below to generate</span>
                </div>
                <span class="email-count" id="emailCount">0</span>
            </div>
            <button class="btn btn-generate" id="generateBtn">Generate New Email</button>
        </section>

        <section class="inbox-section">
            <div class="inbox-header">
                <h2>Inbox</h2>
                <div class="inbox-header-actions">
                    <button class="btn btn-refresh-inbox" id="checkMailBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"/>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                        </svg>
                        Check
                        <span class="new-badge" id="newBadge" style="display:none">!</span>
                    </button>
                    <span class="live-indicator"><span class="pulse-dot"></span> Live</span>
                </div>
            </div>
            <div class="inbox-list" id="inboxList">
                <div class="empty-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
                        <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
                    </svg>
                    <p>Waiting for messages...</p>
                    <span>Send an email to your temp address</span>
                </div>
            </div>
            <div class="email-viewer" id="emailViewer" style="display:none">
                <div class="viewer-header">
                    <button class="viewer-back" id="viewerBack">← Back</button>
                </div>
                <div class="viewer-content">
                    <h3 class="viewer-subject" id="viewerSubject"></h3>
                    <div class="viewer-meta">
                        <span class="viewer-from" id="viewerFrom"></span>
                        <span class="viewer-date" id="viewerDate"></span>
                    </div>
                    <div class="viewer-body" id="viewerBody"></div>
                </div>
            </div>
        </section>

        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>
        <div class="toast" id="toast"></div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>

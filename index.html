<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempMail Pro - Free Disposable Temporary Email</title>
    <meta name="description" content="Free disposable temporary email address. No signup, zero popups, auto-refresh, dark mode, OTP detection. The world's most relaxing temp mail experience.">
    <meta name="keywords" content="temporary email, disposable email, temp mail, fake email, burner email, temp email address, 10 minute mail">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0f172a">
    <meta property="og:title" content="TempMail Pro - Free Disposable Email">
    <meta property="og:description" content="Zero popups, auto-refresh, dark mode, OTP copy. The most relaxing temp mail experience.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tempmail-egsg0qt8g-imrandev.vercel.app/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TempMail Pro - Free Disposable Email">
    <meta name="twitter:description" content="Zero popups, auto-refresh, dark mode, OTP copy. The most relaxing temp mail experience.">
    <link rel="canonical" href="https://tempmail-egsg0qt8g-imrandev.vercel.app/">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📧</text></svg>">
    <script>if(localStorage.getItem('tempmail_theme')!=='light')document.documentElement.classList.add('dark')</script>
    <link rel="preload" href="css/style.css" as="style">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                </svg>
                <h1>TempMail</h1>
                <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle dark/light theme">☀️</button>
            </div>
            <p class="tagline">The world's most relaxing temp mail</p>
        </header>

        <section class="email-section" aria-label="Email generation">
            <div class="email-box">
                <div class="email-display" id="emailDisplay" role="textbox" aria-label="Email address" tabindex="0">
                    <span class="placeholder">Click below to generate</span>
                </div>
                <button class="btn btn-copy" id="copyBtn" title="Copy email" aria-label="Copy email address">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                </button>
            </div>
            <button class="btn btn-generate" id="generateBtn" aria-label="Generate new email address">Generate New Email</button>
        </section>

        <section class="inbox-section" aria-label="Email inbox">
            <div class="inbox-header">
                <h2>Inbox <span class="mail-count" id="mailCount">0</span></h2>
                <div class="inbox-header-actions">
                    <button class="btn btn-action" id="clearAllBtn" title="Clear all messages" aria-label="Clear all messages">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                    </button>
                    <button class="btn btn-refresh-inbox" id="checkMailBtn" aria-label="Check for new messages">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <polyline points="23 4 23 10 17 10"/>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                        </svg>
                        Check
                        <span class="new-badge" id="newBadge" style="display:none" aria-label="New messages">!</span>
                    </button>
                    <span class="live-indicator"><span class="pulse-dot" aria-hidden="true"></span> Live</span>
                </div>
            </div>
            <div class="inbox-list" id="inboxList" role="list">
                <div class="empty-state" role="status">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
                        <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
                    </svg>
                    <p>Waiting for messages...</p>
                    <span>Send an email to your temp address</span>
                </div>
            </div>
            <div class="email-viewer" id="emailViewer" style="display:none" role="dialog" aria-label="Email content">
                <div class="viewer-header">
                    <button class="viewer-back" id="viewerBack" aria-label="Back to inbox">← Back</button>
                    <button class="viewer-delete" id="viewerDelete" aria-label="Delete this email">🗑️</button>
                </div>
                <div class="viewer-content">
                    <h3 class="viewer-subject" id="viewerSubject"></h3>
                    <div class="viewer-meta">
                        <span class="viewer-from" id="viewerFrom"></span>
                        <span class="viewer-date" id="viewerDate"></span>
                    </div>
                    <div class="viewer-body" id="viewerBody"></div>
                </div>
            </div>
        </section>

        <div class="loading" id="loading" role="status" aria-label="Loading">
            <div class="spinner"></div>
        </div>
        <div class="toast" id="toast" role="alert" aria-live="polite"></div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
